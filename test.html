<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Email Me</title>  <style>
    @font-face {
      font-family: "ntmn";
      src: url("/NotoMono.ttf") format("truetype");
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #20243a 0%, #0B0D13 45%, #07080c 100%);
      color: white;
      font-family: ntmn, monospace;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 430px;
      text-align: center;
    }

    /* Email GIF */
    .email-image {
      width: 180px;
      max-width: 70%;
      margin: 0 auto 25px;

      display: block;

      filter:
        drop-shadow(0 0 10px rgba(120, 150, 255, 0.35))
        drop-shadow(0 0 25px rgba(120, 150, 255, 0.15));

      animation: floating 3s ease-in-out infinite;
    }

    @keyframes floating {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    /* Title */
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      letter-spacing: 2px;

      background: linear-gradient(
        90deg,
        #ffffff,
        #9daaff,
        #ffffff
      );

      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      from {
        background-position: 0%;
      }

      to {
        background-position: 200%;
      }
    }

    .description {
      color: #9da1b2;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    /* Main button */
    .email-button {
      display: block;

      padding: 18px 20px;
      border-radius: 18px;

      text-decoration: none;
      color: white;

      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.35),
        inset 0 1px rgba(255, 255, 255, 0.08);

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    .email-button:hover {
      transform: translateY(-5px) scale(1.02);

      background: rgba(120, 140, 255, 0.13);

      box-shadow:
        0 15px 40px rgba(80, 100, 255, 0.18),
        0 0 20px rgba(100, 120, 255, 0.12);
    }

    .email-button:active {
      transform: scale(0.97);
    }

    .button-title {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .email-address {
      font-size: 11px;
      color: #858a9d;
      word-break: break-all;
    }

    /* Small decorative line */
    .line {
      width: 55px;
      height: 3px;
      margin: 20px auto;

      border-radius: 20px;

      background: linear-gradient(
        90deg,
        transparent,
        #8c9aff,
        transparent
      );
    }

    footer {
      margin-top: 25px;
      color: #555a6c;
      font-size: 10px;
    }

    /* Mobile */
    @media (max-width: 400px) {
      .email-image {
        width: 150px;
      }

      h1 {
        font-size: 24px;
      }

      .container {
        width: 86%;
      }
    }
  </style></head><body>  <main class="container"><img
  src="/email4.gif"
  alt="Email"
  class="email-image"
>

<h1>E-mail Me</h1>

<div class="line"></div>

<p class="description">
  Have something to say?<br>
  Feel free to send me an email.
</p>

<a
  href="mailto:sabitvt111@gmail.com"
  class="email-button"
>
  <div class="button-title">
    ✉ E-mail Me
  </div>

  <div class="email-address">
    sabitvt111@gmail.com
  </div>
</a>

<footer>
  © 2026 • Contact
</footer>

  </main></body></html>
